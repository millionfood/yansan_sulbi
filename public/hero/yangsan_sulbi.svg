<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3040"/>
      <stop offset="45%" stop-color="#123a48"/>
      <stop offset="100%" stop-color="#071820"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9d6db"/>
      <stop offset="50%" stop-color="#8fa3ab"/>
      <stop offset="100%" stop-color="#5f737c"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2e788c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2e788c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- industrial floor plane -->
  <path d="M0 720 L1920 640 L1920 1080 L0 1080 Z" fill="#0b222c"/>
  <path d="M0 720 L1920 640" stroke="#e8a54b" stroke-opacity="0.25" stroke-width="2"/>
  <!-- main pipe run -->
  <g opacity="0.9">
    <rect x="220" y="310" width="980" height="56" rx="28" fill="url(#pipe)"/>
    <rect x="1160" y="310" width="56" height="420" rx="28" fill="url(#pipe)"/>
    <rect x="1160" y="700" width="420" height="56" rx="28" fill="url(#pipe)"/>
    <circle cx="1188" cy="338" r="48" fill="#a8b8bf"/>
    <circle cx="1188" cy="728" r="48" fill="#a8b8bf"/>
  </g>
  <!-- water droplets -->
  <g fill="#7ec8d8" filter="url(#soft)" opacity="0.85">
    <ellipse cx="640" cy="420" rx="10" ry="16"/>
    <ellipse cx="700" cy="470" rx="7" ry="12"/>
    <ellipse cx="760" cy="430" rx="9" ry="14"/>
    <ellipse cx="820" cy="500" rx="6" ry="10"/>
    <ellipse cx="1280" cy="560" rx="8" ry="13"/>
    <ellipse cx="1340" cy="610" rx="11" ry="17"/>
  </g>
  <!-- brass valve accent -->
  <g transform="translate(520 286)">
    <circle cx="40" cy="40" r="34" fill="#e8a54b"/>
    <circle cx="40" cy="40" r="18" fill="#1a1208" opacity="0.35"/>
    <rect x="34" y="-10" width="12" height="28" rx="4" fill="#c88830"/>
  </g>
  <!-- subtle grid hint of local work -->
  <g stroke="#e8f1f4" stroke-opacity="0.05" stroke-width="1">
    <path d="M80 800 H1840"/>
    <path d="M120 880 H1800"/>
    <path d="M160 960 H1760"/>
  </g>
</svg>
